<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GÖKBOĞA ARENA v25 · Oyun ve Yeni Bölümler</title><style>html,body{height:100%;margin:0;background:#062e35;font-family:system-ui}#game{position:fixed;inset:0;width:100%;height:100%;border:0}#open{position:fixed;right:12px;bottom:12px;z-index:2;border:2px solid #e9c879;border-radius:22px;background:#087c80;color:white;font-weight:800;padding:13px 17px;box-shadow:0 4px 16px #000a}#panel{position:fixed;inset:0;z-index:3;background:#062e35;overflow:auto;display:none}#panel.active{display:block}#close{position:sticky;top:4px;left:calc(100% - 140px);z-index:4;background:#e7c677;color:#352407;border:0;border-radius:18px;padding:12px 16px;font-weight:800}#hub{padding:0 8px 15px}#warning{position:fixed;top:0;left:0;right:0;text-align:center;background:#062e35c9;color:#fff2c4;font:12px system-ui;z-index:1;pointer-events:none}@media(max-width:600px){#open{bottom:8px;right:8px;padding:9px 12px;font-size:12px}}</style><link rel="stylesheet" href="./onizleme-v25/gorsel-referans-modulleri.css"></head><body><iframe id="game" title="Gökboğa Arena oyunu" src="./Gokboga-Arena-v24.html" allow="microphone; camera; autoplay"></iframe><div id="warning">v25 geliştirme · oyun v24 + yeni bölümler önizlemesi · satın alma ve ödül işlemleri kapalı</div><button id="open" type="button" aria-controls="panel" aria-expanded="false">🎒 YENİ BÖLÜMLER</button><div id="panel" role="dialog" aria-label="Gökboğa Arena yeni bölümler"><button id="close" type="button">✕ OYUNA DÖN</button><div id="hub"></div></div><script src="./onizleme-v25/canta-koleksiyon.js"></script><script src="./onizleme-v25/gorsel-referans-modulleri.js"></script><script>(function(){const panel=document.getElementById("panel"),open=document.getElementById("open");function toggle(show){panel.classList.toggle("active",show);open.setAttribute("aria-expanded",String(show));if(show){panel.scrollTop=0;document.getElementById("close").focus()}else open.focus()}open.addEventListener("click",()=>toggle(true));document.getElementById("close").addEventListener("click",()=>toggle(false));document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel.classList.contains("active"))toggle(false)});GokbogaHub.create(document.getElementById("hub"),{vipLevel:0});

 try{
  const doc=game.contentDocument;

  const tileStyle=doc.createElement("style");tileStyle.id="gokboga-v25-okey-taslari";tileStyle.textContent=`#ga-oyunlar .ga-okey .ga-okey-tas-sirasi .ga-tas,#ga-oyunlar .ga-okey .ga-orta .ga-tas{background:linear-gradient(155deg,#ffffff 0%,#f8fbff 65%,#e6ebf2 100%)!important;border:1px solid #c5ced8!important;border-bottom:3px solid #9ba8b8!important;border-radius:4px!important;box-shadow:0 2px 3px #102b3844!important;font-family:Arial,system-ui,sans-serif!important;font-weight:900!important;letter-spacing:-.035em!important;text-shadow:0 1px #ffffff99!important}#ga-oyunlar .ga-okey .ga-okey-tas-sirasi .ga-tas{font-size:clamp(15px,2.8cqw,29px)!important;min-height:clamp(36px,7cqh,65px)!important}#ga-oyunlar .ga-okey .ga-orta .ga-tas{font-size:clamp(12px,2cqw,23px)!important}#ga-oyunlar .ga-okey .ga-tas.ga-m{color:#1678b9!important}#ga-oyunlar .ga-okey .ga-tas.ga-k{color:#cb4662!important}#ga-oyunlar .ga-okey .ga-tas.ga-y{color:#a78023!important}#ga-oyunlar .ga-okey .ga-tas.ga-secili{outline:3px solid #1dd9d0!important;transform:translateY(-3px)}@media(max-height:480px){#ga-oyunlar .ga-okey .ga-okey-tas-sirasi .ga-tas{min-height:29px!important;font-size:clamp(13px,2.5cqw,22px)!important}}`;doc.head.appendChild(tileStyle);

  const launch=doc.createElement("button");launch.id="gokboga-v25-open";launch.type="button";launch.textContent="🎒 ÇANTA · VIP · ÖDÜLLER";doc.body.appendChild(launch);

  /* Başarılı oyun-içi kurulumdan sonra dış önizleme düğmesini gizle. */

 }catch(err){console.warn("Gökboğa v25 oyun içi kurulum yapılamadı; dış panel kullanılabilir.",err)}
